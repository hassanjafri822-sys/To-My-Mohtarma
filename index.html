<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Corner For You 🌙</title>

    <meta name="description"
          content="A peaceful little place made with care.">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito:wght@300;400;600&family=Parisienne&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- ==========================
            BACKGROUND
    =========================== -->

    <div class="background">

        <div class="moon"></div>

        <div class="stars"></div>

        <div class="clouds"></div>

    </div>

    <!-- ==========================
            MAIN CONTENT
    =========================== -->

    <main class="hero">

        <section class="glass-card">

    <div id="content">

        <p class="small-title">
            Welcome 🌙
        </p>

        <h1>
            If Today Feels Heavy...
        </h1>

        <p class="description">
            This little corner was made just for you.
            <br>
            Stay for as long as you'd like.
        </p>

        <button
            class="enter-btn"
            id="enterBtn">

            <span>Come In</span>
            <span class="arrow">→</span>

        </button>

        <p class="signature">
            — Made with care
        </p>

    </div>

</section>

    </main>

    <!-- ==========================
            CURSOR GLOW
    =========================== -->

    <div class="cursor-glow"></div>

    <!-- ==========================
            LOADER
    =========================== -->

    <div class="loader">

        <div class="loader-moon"></div>

        <p>Preparing your little corner...</p>

    </div>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
